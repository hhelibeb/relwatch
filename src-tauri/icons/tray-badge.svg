<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="5" fill="url(#bg)"/>
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.95"/>
  <g transform="translate(16,16)" stroke="#ffffff" stroke-linecap="round">
    <line y1="-11" y2="-13" stroke-width="1.6" transform="rotate(0)"/>
    <line y1="-11" y2="-13" stroke-width="1.6" transform="rotate(90)"/>
    <line y1="-11" y2="-13" stroke-width="1.6" transform="rotate(180)"/>
    <line y1="-11" y2="-13" stroke-width="1.6" transform="rotate(270)"/>
    <line y1="-11.5" y2="-13" stroke-width="1.1" transform="rotate(30)" opacity="0.6"/>
    <line y1="-11.5" y2="-13" stroke-width="1.1" transform="rotate(60)" opacity="0.6"/>
    <line y1="-11.5" y2="-13" stroke-width="1.1" transform="rotate(120)" opacity="0.6"/>
    <line y1="-11.5" y2="-13" stroke-width="1.1" transform="rotate(150)" opacity="0.6"/>
    <line y1="-11.5" y2="-13" stroke-width="1.1" transform="rotate(210)" opacity="0.6"/>
    <line y1="-11.5" y2="-13" stroke-width="1.1" transform="rotate(240)" opacity="0.6"/>
    <line y1="-11.5" y2="-13" stroke-width="1.1" transform="rotate(300)" opacity="0.6"/>
    <line y1="-11.5" y2="-13" stroke-width="1.1" transform="rotate(330)" opacity="0.6"/>
  </g>
  <g transform="translate(16,16)" stroke="#ffffff" stroke-linecap="round">
    <line x1="0" y1="0" x2="-3.8" y2="-2.2" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="5.5" y2="-3.2" stroke-width="2"/>
  </g>
  <circle cx="16" cy="16" r="1.8" fill="#ffffff"/>

  <!-- 右上角红色 badge 圆点 -->
  <circle cx="26" cy="6" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
