# cargo audit 配置（Rust 依赖漏洞扫描白名单）
#
# 原则（见 docs/安全审计报告-2026-09-11.md §2 / §6）：
#   · 有补丁版本的 vulnerable 条目一律**不** ignore，直接升级依赖；
#   · 只放行「当前依赖图中不可达」或「上游尚无补丁」的条目，且必须写明理由与解除条件；
#   · unmaintained / unsound / yanked 类 warning 默认不阻塞（cargo audit 只在
#     `--deny warnings` 时对 warning 失败），因此无需在此列出。

[advisories]
ignore = [
    # rkyv 0.7.46 — RUSTSEC-2026-0235（归档校验不足可致 Rc/Arc 归档越界读）
    # 理由：**不可达**。rkyv 仅由 rust_decimal 的可选 feature 引入，当前 feature 解析下
    #       未被任何编入二进制的 crate 使用（`cargo tree -i rkyv --target all` 无输出）。
    # 解除条件：rust_decimal 放开 rkyv 版本约束（>= 0.8.17）后随 cargo update 自然消除，
    #           届时请删除本行。
    "RUSTSEC-2026-0235",

    # zip 4.6.1 — RUSTSEC-2026-0367 / 0368 / 0369（解包 SUID/SGID 位保留、symlink
    # 目标不受限于解包目录，三条均为提权类，补丁版本 >= 9.0.0）
    # 理由：**当前流程不可达**。zip 只由 tauri-plugin-updater 在 Windows 目标下引入，
    #       且仅当下载到的更新包是 zip（`infer::archive::is_zip`）时才走 `ZipArchive::extract`；
    #       本项目 Windows 产物是 `.exe` / `.msi`，走 `extract_exe`，解包路径不执行。
    #       另外插件 2.x 约束 `zip = "4"`（3.x 仍为 alpha），上游暂无可用的 9.x 迁移；
    #       更新包在解包前已完成 minisign 签名校验。
    # 解除条件：tauri-plugin-updater 放开 zip 9（或随 tauri 3 升级）后 `cargo update` 消除，
    #           届时请删除以下三行。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
