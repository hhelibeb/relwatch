[package]
name = "relwatch"
version = "1.3.2"
description = "RelWatch - Monitor GitHub releases"
authors = ["hhelibeb <hhelibeb@foxmail.com>"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.11.1", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hostname = "0.4"
keyring = "3"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-prevent-default = "5"
sys-locale = "0.3"

[dev-dependencies]
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.61", features = ["Win32_System_Com"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = "4"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
