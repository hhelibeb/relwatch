[package]
name = "relwatch"
version = "1.12.0"
description = "RelWatch - Monitor GitHub releases"
authors = ["hhelibeb <hhelibeb@foxmail.com>"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.11.1", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"
reqwest = { version = "0.12", features = ["json"] }
# WBI 签名需要 MD5（B 站 web 端风控签名）
md-5 = "0.10"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hostname = "0.4"
keyring = "3"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-prevent-default = "5"
# 直接依赖以便在主线程上执行剪贴板写入（插件在 tokio worker 线程调用会触发 Windows 1418）
arboard = "3.6"
sys-locale = "0.3"
async-trait = "0.1"
quick-xml = "0.39"
# 前后端类型单一来源：为 Tauri 命令自动生成 TS 绑定（阶段 0 试点，pin 精确版本防 rc 漂移）
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript", "derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"

[dev-dependencies]
wiremock = "0.6"
# tauri test mock（mock_builder/noop_assets）：命令层测试用，feature 为空不影响运行时构建
tauri = { version = "~2.11.1", features = ["test"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
# Win32_System_JobObjects：把 pi 常驻进程纳入 JobObject（评审 3.5——句柄关闭时由内核
# 终止作业内全部进程，消除「pi 自身退出后其工具子进程残留」的窗口）。
# Win32_System_Threading：OpenProcess 取进程句柄以纳管进 JobObject。
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    # CreateJobObjectW 的 SECURITY_ATTRIBUTES 形参由 Win32_Security 提供，
    # 未启用该 feature 时该函数被 cfg 掉（windows crate 的按依赖剪裁）
    "Win32_Security",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = "4"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
