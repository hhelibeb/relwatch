name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
