name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 版本号三处一致性：tauri.conf.json 决定发布产物版本（tagName/releaseName/latest.json），
      # 漏改它只会在 release 时表现为「发到旧版本的 release 上 + updater 静默不更新」
      - run: node scripts/check-version.mjs
      # 真实构建（`pnpm run build` = vue-tsc --noEmit && vite build）：含 SFC 类型检查，
      # 不再另列 typecheck（同一 job 内重复跑一遍 vue-tsc 只是白等，lint.yml 已单独报该信号）。
      # typecheck/coverage 都不产出 dist，vite.config.ts 写错只会在打 tag 后由 release.yml
      # 的 beforeBuildCommand 暴露，那时回滚成本是「已推 tag + 双平台 LTO 重跑」
      - run: pnpm run build
      # 覆盖率模式运行全部测试并执行 vitest.config.ts 中的 thresholds 门槛，低于门槛时非零退出
      - run: pnpm run coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/lcov-report
          retention-days: 14

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      # 覆盖率插桩运行全部测试；低于 70% 行覆盖率时非零退出
      - run: cargo llvm-cov --all-features --fail-under-lines 70
        working-directory: src-tauri
      # bindings.ts 同步校验：Rust 侧命令/类型/事件变更后必须重新生成并提交
      - name: check bindings.ts in sync
        run: bash scripts/check-bindings.sh

  backend-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: cargo test
        working-directory: src-tauri

  backend-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: cargo check
        working-directory: src-tauri
